    ${baru ? `<p class="small muted" style="margin:-4px 0 14px">Tagihan pertama dibuat sesuai tanggal masuk, lalu otomatis tiap bulan.</p>` : `<p class="small muted" style="margin:-4px 0 14px">Perubahan harga dan tanggal bayar berlaku untuk tagihan yang belum dibayar dan belum lewat.</p>`}
    <div class="sh-actions"><button type="button" class="btn ghost" data-act="${baru ? 'tutup' : 'kamar'}" data-id="${kamarId}">Batal</button><button class="btn" type="submit">${baru ? 'Simpan penyewa' : 'Simpan perubahan'}</button></div>
  </form>`);
  const masuk = $('#p-masuk'), hari = $('#p-hari');
  if (masuk) masuk.addEventListener('change', () => { if (masuk.value) hari.value = C.parse(masuk.value).getDate(); });
}

/* ---------- sheet: tagihan & bayar ---------- */
function openTagihan(id) {
  const t = tagihanById(id); if (!t) return;
  const bayar = S.data.pembayaran.filter(b => b.tagihanId === id).sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  const wa = t.status !== 'lunas' ? waTagihan(t) : '';
  sheet(`${head('Tagihan ' + C.fmtPeriode(t.periode), `${esc(t.penyewa ? t.penyewa.nama : '')}, ${esc(t.kos ? t.kos.nama : '')} kamar ${esc(t.kamar ? t.kamar.nomor : '')}`)}
    <div class="callout ${t.status}">${t.status === 'lunas' ? 'Tagihan ini sudah lunas.' : teksTempo(t) + '. Sisa ' + C.rupiah(t.sisa) + '.'}</div>
    <dl class="info"><dt>Jatuh tempo</dt><dd>${C.fmtTgl(t.jatuhTempo)}</dd><dt>Nominal</dt><dd>${C.rupiah(t.nominal)}</dd><dt>Sudah dibayar</dt><dd>${C.rupiah(t.dibayar)}</dd>${t.catatan ? `<dt>Catatan</dt><dd>${esc(t.catatan)}</dd>` : ''}</dl>
    ${bayar.length ? `<div class="flabel" style="margin-bottom:8px">Pembayaran</div><div class="mini-list">${bayar.map(b => `<div class="row tap" data-act="kuitansi" data-id="${b.id}"><div class="row-main"><div class="row-title" style="font-weight:650">${C.fmtTgl(b.tanggal)}</div><div class="row-meta">${esc(b.metode)}${b.catatan ? ', ' + esc(b.catatan) : ''}</div></div><div class="amt">${C.rupiah(b.nominal)}</div></div>`).join('')}</div>` : ''}
    ${logHTML(t.id)}
    ${t.status !== 'lunas' ? `<div class="sh-actions" style="margin-bottom:8px"><button class="btn" data-act="bayar" data-id="${t.id}">Catat bayar</button>${wa ? `<button class="btn ghost" data-act="kirimTagihan" data-id="${t.id}">${IC.wa}Ingatkan</button>` : ''}</div>` : ''}
    <div class="sh-actions"><button class="btn ghost" data-act="ubahTagihan" data-id="${t.id}">${IC.edit}Ubah nominal</button>${t.kamar ? `<button class="btn ghost" data-act="kamar" data-id="${t.kamar.id}">Lihat kamar</button>` : ''}</div>`);
}

function openBayar(id) {
  const t = tagihanById(id); if (!t) return;
  sheet(`${head('Catat pembayaran', `${esc(t.penyewa ? t.penyewa.nama : '')}, ${esc(t.kos ? t.kos.nama : '')} kamar ${esc(t.kamar ? t.kamar.nomor : '')}`)}
  <form data-form="bayar">
    <input type="hidden" name="tagihanId" value="${t.id}">
    <div class="callout ${t.status}">Sewa ${C.fmtPeriode(t.periode)}: sisa ${C.rupiah(t.sisa)}${t.sebagian ? ' (sudah dibayar ' + C.rupiah(t.dibayar) + ')' : ''}.</div>
    <div class="field"><label for="b-nom">Jumlah dibayar</label><div class="prefix"><span>Rp</span><input class="input money" id="b-nom" name="nominal" inputmode="numeric" required value="${t.sisa}"></div>
      <div class="quick"><button type="button" data-isi="${t.sisa}">Lunas ${C.rupiah(t.sisa)}</button>${t.sisa >= 200000 ? `<button type="button" data-isi="${Math.round(t.sisa / 2 / 1000) * 1000}">Setengah</button>` : ''}</div></div>
    <div class="field"><label for="b-tgl">Tanggal bayar</label><input class="input" type="date" id="b-tgl" name="tanggal" required value="${S.today}" max="${S.today}"></div>
    <div class="field"><span class="flabel">Cara bayar</span><div class="seg">${['Tunai', 'Transfer', 'QRIS'].map((m, i) => `<label><input type="radio" name="metode" value="${m}" ${i === 0 ? 'checked' : ''}><span>${m}</span></label>`).join('')}</div></div>
    <div class="field"><label for="b-cat">Catatan</label><input class="input" id="b-cat" name="catatan" placeholder="Opsional"></div>
    <div class="sh-actions"><button type="button" class="btn ghost" data-act="tutup">Batal</button><button class="btn" type="submit">Simpan pembayaran</button></div>
  </form>`);
  sheetEl.querySelectorAll('[data-isi]').forEach(b => b.addEventListener('click', () => { $('#b-nom').value = fmtAngka(+b.dataset.isi); }));
}

function openKuitansi(bayarId) {
  const b = S.data.pembayaran.find(x => x.id === bayarId); if (!b) return;
  const t = tagihanById(b.tagihanId) || {};
  const p = penyewaById(b.penyewaId) || {}, kos = kosById(b.kosId) || {}, km = t.kamar || {};
  const s = S.data.settings;
  const lunas = t.status === 'lunas';
  const wa = C.normalWa(p.wa);
  sheet(`${head('Kuitansi pembayaran')}
    <div class="receipt">
      <div class="receipt-top"><div><b>${esc(s.namaUsaha)}</b><small>${esc(kos.nama || '')}${kos.alamat ? ', ' + esc(kos.alamat) : ''}</small></div><div style="text-align:right"><small>No.</small><b style="font-size:13px">${esc(b.id.slice(-7).toUpperCase())}</b></div></div>
      <dl><dt>Diterima dari</dt><dd>${esc(p.nama || '-')}</dd><dt>Kamar</dt><dd>${esc(km.nomor || '-')}</dd><dt>Untuk sewa</dt><dd>${t.periode ? C.fmtPeriode(t.periode) : '-'}</dd><dt>Tanggal</dt><dd>${C.fmtTgl(b.tanggal)}</dd><dt>Cara bayar</dt><dd>${esc(b.metode)}</dd>${!lunas && t.sisa ? `<dt>Sisa tagihan</dt><dd class="neg">${C.rupiah(t.sisa)}</dd>` : ''}</dl>
      <div class="receipt-amt"><span class="muted">Jumlah</span>${lunas ? '<span class="stamp">LUNAS</span>' : ''}<b>${C.rupiah(b.nominal)}</b></div>
    </div>
    <div class="sh-actions" style="margin-top:16px">${wa ? `<button class="btn" data-act="kirimKuitansi" data-id="${b.id}">${IC.wa}Kirim ke WA penyewa</button>` : ''}<button class="btn ghost" data-act="cetak">${IC.print}Cetak</button></div>
    <div style="margin-top:14px;text-align:center"><button class="btn danger sm" data-act="hapusBayar" data-id="${b.id}">${IC.trash}Batalkan pembayaran ini</button></div>`);
}

const JENIS_LOG = { sebelum: 'Otomatis, sebelum jatuh tempo', hari_ini: 'Otomatis, hari jatuh tempo', telat: 'Otomatis, telat bayar', manual: 'Dikirim dari aplikasi', kuitansi: 'Kuitansi' };
function logHTML(tagihanId) {
  const l = (S.data.log || []).filter(x => x.tagihanId === tagihanId).slice(-5).reverse();
  if (!l.length) return '';
  return `<div class="flabel" style="margin-bottom:8px">Pesan WhatsApp terkirim</div><div class="mini-list">${l.map(x => {
    const ok = String(x.status).indexOf('terkirim') === 0;
    return `<div class="row"><div class="row-main"><div class="row-title" style="font-weight:650">${C.fmtTgl(x.tanggal)}</div><div class="row-meta">${esc(JENIS_LOG[x.jenis] || x.jenis)}</div></div><span class="pill ${ok ? 'lunas' : 'telat'}">${ok ? 'Terkirim' : 'Gagal'}</span></div>`;
  }).join('')}</div>`;
}

/* kirim pesan: pratinjau, bisa diedit, lalu kirim lewat Fonnte (atau buka WhatsApp) */
function openKirim(jenis, id) {
  const s = S.data.settings;
  let t, pesan, judul;
  if (jenis === 'kuitansi') {
    const b = S.data.pembayaran.find(x => x.id === id); if (!b) return;
    t = tagihanById(b.tagihanId); if (!t) return;
    pesan = C.pesanKuitansi(b, t, s); judul = 'Kirim kuitansi';
  } else {
    t = tagihanById(id); if (!t) return;
    pesan = C.pesanUntuk(t, s, S.today); judul = 'Kirim pengingat';
  }
  const p = t.penyewa || {};
  const fonnte = !DEMO && s.adaToken;
  const w = sheet(`${head(judul, `ke ${esc(p.nama)}, ${esc(p.wa)}`)}
    <form data-form="kirim">
      <input type="hidden" name="jenis" value="${jenis}"><input type="hidden" name="id" value="${id}">
      <div class="field"><label for="w-pesan">Isi pesan</label><textarea class="textarea" id="w-pesan" name="pesan" style="min-height:140px">${esc(pesan)}</textarea>
      <span class="help">Bisa diubah sebelum dikirim. Isi pesan bawaan diatur di Pengaturan.</span></div>
      ${fonnte ? '' : `<div class="note" style="margin-bottom:14px">${DEMO ? 'Di mode contoh pesan dibuka lewat WhatsApp.' : '<b>Belum terhubung ke Fonnte.</b> Isi token Fonnte di Pengaturan supaya pesan langsung terkirim tanpa membuka WhatsApp.'}</div>`}
      <div class="sh-actions">
        <button type="button" class="btn ${fonnte ? 'ghost' : ''}" data-act="bukaWa">${IC.wa}${fonnte ? 'Buka WhatsApp' : 'Kirim lewat WhatsApp'}</button>
        ${fonnte ? `<button class="btn" type="submit">${IC.send}Kirim sekarang</button>` : ''}
      </div>
    </form>`);
  w.querySelector('[data-act=bukaWa]').dataset.wa = C.normalWa(p.wa);
}

/* ---------- sheet: kos & kamar ---------- */
function formKos(k) {
  const baru = !k;
  sheet(`${head(baru ? 'Tambah kos' : 'Ubah kos', baru ? 'Kamar dibuat otomatis, nanti bisa diubah satu per satu.' : '')}
  <form data-form="kos">
    <input type="hidden" name="id" value="${k ? k.id : ''}">
    <div class="field"><label for="k-nama">Nama kos</label><input class="input" id="k-nama" name="nama" required value="${esc(k ? k.nama : '')}" placeholder="Misal: Kos Mekarsari" autocomplete="off"></div>
    <div class="field"><label for="k-al">Alamat</label><input class="input" id="k-al" name="alamat" value="${esc(k ? k.alamat : '')}" placeholder="Opsional"></div>
    ${baru ? `<div class="grid2">
      <div class="field"><label for="k-n">Jumlah kamar</label><input class="input" type="number" min="0" max="200" id="k-n" name="jumlahKamar" required value="8"></div>
      <div class="field"><label for="k-aw">Awalan nomor</label><input class="input" id="k-aw" name="awalan" maxlength="3" placeholder="Opsional, misal A"></div></div>
    <div class="field"><label for="k-h">Harga sewa per kamar</label><div class="prefix"><span>Rp</span><input class="input money" id="k-h" name="hargaDefault" inputmode="numeric" required placeholder="750.000"></div><span class="help" id="k-prev"></span></div>` :
    `<div class="field"><label for="k-cat">Catatan</label><input class="input" id="k-cat" name="catatan" value="${esc(k.catatan || '')}" placeholder="Opsional"></div>`}
    <div class="sh-actions"><button type="button" class="btn ghost" data-act="tutup">Batal</button><button class="btn" type="submit">${baru ? 'Tambah kos' : 'Simpan perubahan'}</button></div>
  </form>`);
  if (baru) {
    const upd = () => { const n = +$('#k-n').value || 0, a = $('#k-aw').value.trim(), w = Math.max(2, String(n).length), f = i => a + String(i).padStart(w, '0'); $('#k-prev').textContent = n ? `Akan dibuat kamar ${f(1)} sampai ${f(n)}.` : 'Kamar bisa ditambahkan nanti.'; };
    $('#k-n').addEventListener('input', upd); $('#k-aw').addEventListener('input', upd); upd();
  }
}
function formKamar(kosId, km) {
  const kos = kosById(km ? km.kosId : kosId);
  const ks = kamarKos(kos.id);
  let saran = '';
  if (!km) { const nums = ks.map(x => parseInt(x.nomor.replace(/\D/g, ''), 10)).filter(n => !isNaN(n)); saran = String((nums.length ? Math.max(...nums) : 0) + 1).padStart(2, '0'); }
  const hargaUmum = ks.length ? ks[ks.length - 1].harga : '';
  sheet(`${head(km ? 'Ubah kamar ' + esc(km.nomor) : 'Tambah kamar', esc(kos.nama))}
  <form data-form="kamar">
    <input type="hidden" name="id" value="${km ? km.id : ''}"><input type="hidden" name="kosId" value="${kos.id}">
    <div class="grid2">
      <div class="field"><label for="r-no">Nomor kamar</label><input class="input" id="r-no" name="nomor" required value="${esc(km ? km.nomor : saran)}"></div>
      <div class="field"><label for="r-h">Harga sewa</label><div class="prefix"><span>Rp</span><input class="input money" id="r-h" name="harga" inputmode="numeric" required value="${km ? km.harga : hargaUmum}"></div></div>
    </div>
    <div class="field"><label for="r-f">Fasilitas</label><input class="input" id="r-f" name="fasilitas" value="${esc(km ? km.fasilitas : '')}" placeholder="Opsional, misal kamar mandi dalam, AC"></div>
    ${km && S.ks[km.id].penyewa ? '<p class="small muted" style="margin:-4px 0 14px">Harga sewa penyewa saat ini diatur di data penyewa. Harga kamar dipakai untuk penyewa berikutnya.</p>' : ''}
    <div class="sh-actions"><button type="button" class="btn ghost" data-act="tutup">Batal</button><button class="btn" type="submit">${km ? 'Simpan perubahan' : 'Tambah kamar'}</button></div>
  </form>`);
}
function formPengeluaran(e) {
  const kat = ['Listrik', 'Air', 'Wifi', 'Perbaikan', 'Kebersihan', 'Pajak', 'Lainnya'];
  const kosId = e ? e.kosId : (route().page === 'kos' && route().id) || (S.data.kos[0] || {}).id;
  sheet(`${head(e ? 'Ubah pengeluaran' : 'Catat pengeluaran')}
  <form data-form="pengeluaran">
    <input type="hidden" name="id" value="${e ? e.id : ''}">
    <div class="field"><label for="e-kos">Untuk kos</label><select class="select" id="e-kos" name="kosId" required>${S.data.kos.map(k => `<option value="${k.id}" ${k.id === kosId ? 'selected' : ''}>${esc(k.nama)}</option>`).join('')}</select></div>
    <div class="field"><span class="flabel">Kategori</span><div class="seg">${kat.map((k, i) => `<label style="flex:0 0 auto;min-width:0"><input type="radio" name="kategori" value="${k}" ${(e ? e.kategori === k : i === 0) ? 'checked' : ''}><span style="padding:8px 12px">${k}</span></label>`).join('')}</div></div>
    <div class="grid2">
      <div class="field"><label for="e-nom">Nominal</label><div class="prefix"><span>Rp</span><input class="input money" id="e-nom" name="nominal" inputmode="numeric" required value="${e ? e.nominal : ''}"></div></div>
      <div class="field"><label for="e-tgl">Tanggal</label><input class="input" type="date" id="e-tgl" name="tanggal" required value="${e ? e.tanggal : S.today}"></div>
    </div>
    <div class="field"><label for="e-ket">Keterangan</label><input class="input" id="e-ket" name="keterangan" value="${esc(e ? e.keterangan : '')}" placeholder="Opsional"></div>
    <div class="sh-actions">${e ? `<button type="button" class="btn danger" data-act="hapusPengeluaran" data-id="${e.id}">${IC.trash}Hapus</button>` : `<button type="button" class="btn ghost" data-act="tutup">Batal</button>`}<button class="btn" type="submit">Simpan</button></div>
  </form>`);
}

/* ---------- aksi klik ---------- */
const ACT = {
  tutup: () => closeSheet(),
  kamar: d => openKamar(d.id),
  tagihan: d => openTagihan(d.id),
  bayar: d => openBayar(d.id),
  kuitansi: d => openKuitansi(d.id),
  pasang: () => pasangApp(),
  tutupPasang() { store.set('kosTutupPasang', '1'); render(); },
  kirimTagihan: d => openKirim('tagihan', d.id),
  kirimKuitansi: d => openKirim('kuitansi', d.id),
  bukaWa(d) {
    const pesan = $('#w-pesan').value;
    window.open('https://wa.me/' + d.wa + '?text=' + encodeURIComponent(pesan), '_blank', 'noopener');
    closeSheet();
  },
  cetak: () => window.print(),
  bukaKos: d => { location.hash = '#/kos/' + d.id; },
  tambahKos: () => formKos(),
  ubahKos: d => formKos(kosById(d.id)),
  tambahKamar: d => formKamar(d.id),
  ubahKamar: d => formKamar(null, kamarById(d.id)),
  isiKamar: d => formPenyewa(d.id),
  ubahPenyewa: d => { const p = penyewaById(d.id); formPenyewa(p.kamarId, p); },
  tambahPengeluaran: () => S.data.kos.length ? formPengeluaran() : toast('Tambahkan kos dulu', true),
  ubahPengeluaran: d => formPengeluaran(S.data.pengeluaran.find(e => e.id === d.id)),
  async hapusKos(d) {
    const k = kosById(d.id);
    if (!await konfirmasi('Hapus ' + esc(k.nama) + '?', 'Semua kamar beserta riwayat tagihan, pembayaran, dan pengeluaran kos ini ikut terhapus. Tindakan ini tidak bisa dibatalkan.', 'Hapus kos', true)) return;
    await aksi('hapusKos', { id: d.id }, 'Kos dihapus'); location.hash = '#/kos';
  },
  async hapusKamar(d) {
    const k = kamarById(d.id);
    if (!await konfirmasi('Hapus kamar ' + esc(k.nomor) + '?', 'Kamar akan hilang dari papan kamar.', 'Hapus kamar', true)) return openKamar(d.id);
    await aksi('hapusKamar', { id: d.id }, 'Kamar dihapus');
  },
  async keluar(d) {
    const p = penyewaById(d.id);
    const w = sheet(`${head(esc(p.nama) + ' keluar', 'Kamar akan kosong dan bisa diisi penyewa baru.')}
      <form data-form="keluar"><input type="hidden" name="id" value="${p.id}">
      <div class="field"><label for="k-tgl">Tanggal keluar</label><input class="input" type="date" id="k-tgl" name="tglKeluar" required value="${S.today}"></div>
      <p class="small muted" style="margin:-4px 0 14px">Tagihan yang belum dibayar dengan jatuh tempo setelah tanggal ini dihapus. Tunggakan sebelumnya tetap tercatat.${p.deposit ? ' Deposit ' + C.rupiah(p.deposit) + ' jangan lupa dikembalikan atau diperhitungkan.' : ''}</p>
      <div class="sh-actions"><button type="button" class="btn ghost" data-act="kamar" data-id="${p.kamarId}">Batal</button><button class="btn danger solid" type="submit">Konfirmasi keluar</button></div></form>`);
  },
  ubahTagihan(d) {
    const t = tagihanById(d.id);
    sheet(`${head('Ubah tagihan ' + C.fmtPeriode(t.periode), esc(t.penyewa ? t.penyewa.nama : ''))}
      <form data-form="tagihan"><input type="hidden" name="id" value="${t.id}">
      <div class="grid2"><div class="field"><label for="t-nom">Nominal</label><div class="prefix"><span>Rp</span><input class="input money" id="t-nom" name="nominal" inputmode="numeric" value="${t.nominal}"></div></div>
      <div class="field"><label for="t-jt">Jatuh tempo</label><input class="input" type="date" id="t-jt" name="jatuhTempo" value="${t.jatuhTempo}" required></div></div>
      <div class="field"><label for="t-cat">Catatan</label><input class="input" id="t-cat" name="catatan" value="${esc(t.catatan)}" placeholder="Misal: diskon karena renovasi"></div>
      <p class="small muted" style="margin:-4px 0 14px">Isi nominal 0 untuk membebaskan sewa bulan ini.</p>
      <div class="sh-actions"><button type="button" class="btn ghost" data-act="tagihan" data-id="${t.id}">Batal</button><button class="btn" type="submit">Simpan</button></div></form>`);
  },
  async hapusBayar(d) {
    const b = S.data.pembayaran.find(x => x.id === d.id);
    if (!await konfirmasi('Batalkan pembayaran?', `Pembayaran ${C.rupiah(b.nominal)} tanggal ${C.fmtTgl(b.tanggal)} akan dihapus dan tagihannya kembali belum lunas.`, 'Batalkan pembayaran', true)) return openKuitansi(d.id);
    await aksi('hapusBayar', { id: d.id }, 'Pembayaran dibatalkan'); openTagihan(b.tagihanId);
  },
  async hapusPengeluaran(d) {
    if (!await konfirmasi('Hapus pengeluaran ini?', 'Catatan pengeluaran akan dihapus dari laporan kas.', 'Hapus', true)) return;
    await aksi('hapusPengeluaran', { id: d.id }, 'Pengeluaran dihapus');
  },
  geser(d) {
    const k = d.t === 'kas' ? 'kasBulan' : 'bulan';
    S[k] = C.addMonths(S[k], +d.d); render();
  },
  fStatus(d) { S.fStatus = d.v; render(); },
  fKamar(d) { S.fKamar = { id: d.id, v: d.v }; render(); },
  foto: d => openFoto(d.id),
  ubahProfil: d => formProfil(d.id),
  linkPendek(d) {
    const k = kosById(d.id), pr = profilKos(d.id);
    const saran = String(k.nama).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join('').slice(0, 30);
    sheet(`${head(pr.linkPendek ? 'Ganti link pendek' : 'Buat link pendek', esc(k.nama))}
      <form data-form="linkPendek"><input type="hidden" name="kosId" value="${k.id}">
        <div class="field"><label for="lp-alias">Nama link</label>
          <div class="prefix"><span style="left:13px">is.gd/</span><input class="input" id="lp-alias" name="alias" style="padding-left:62px" maxlength="30" pattern="[A-Za-z0-9_]{5,30}" placeholder="${esc(saran.length >= 5 ? saran : 'KosBudiGebang')}" autocomplete="off"></div>
          <span class="help">5 sampai 30 huruf atau angka, tanpa spasi. Kosongkan untuk kode acak, misalnya is.gd/aB3xYz.</span></div>
        ${saran.length >= 5 ? `<div class="quick" style="margin:-6px 0 14px"><button type="button" data-isi-alias="${esc(saran)}">${esc(saran)}</button></div>` : ''}
        ${pr.linkPendek ? `<div class="note" style="margin-bottom:14px">Link lama <b>${esc(pr.linkPendek)}</b> tetap bisa dibuka, tapi aplikasi akan menampilkan link yang baru.</div>` : ''}
        <div class="sh-actions"><button type="button" class="btn ghost" data-act="tutup">Batal</button><button class="btn" type="submit">Buat link</button></div>
      </form>`);
    sheetEl.querySelectorAll('[data-isi-alias]').forEach(b => b.addEventListener('click', () => { $('#lp-alias').value = b.dataset.isiAlias; }));
  },
  async sampulFoto(d) {
    const ket = $('#fo-ket'), f = S.data.foto.find(x => x.id === d.id);
    if (ket && f && ket.value !== f.keterangan) await api('ubahFoto', { id: d.id, keterangan: ket.value });
    await aksi('sampulFoto', { id: d.id }, 'Jadi foto sampul'); closeSheet();
  },
  async hapusFoto(d) {
    const f = S.data.foto.find(x => x.id === d.id);
    if (!await konfirmasi('Hapus foto ini?', 'Foto akan hilang dari website dan dipindah ke sampah Google Drive.', 'Hapus foto', true)) return openFoto(d.id);
    await aksi('hapusFoto', { id: d.id }, 'Foto dihapus');
  },
  async salinLink(d) {
    try { await navigator.clipboard.writeText(d.url || urlWebsite()); toast('Link disalin'); }
    catch (e) { toast('Tidak bisa menyalin otomatis. Tekan lama link untuk menyalin.', true); }
  },
  sisip(d) {
    const ta = document.getElementById(d.t); const v = d.v;
    const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
    ta.value = ta.value.slice(0, a) + v + ta.value.slice(b); ta.focus(); ta.selectionStart = ta.selectionEnd = a + v.length;
  },
  async tesWa() { busy(true); try { await api('tesWa'); toast('Pesan tes terkirim ke WhatsApp pemilik'); } catch (e) { toast(e.message, true); } finally { busy(false); } },
  async kirimSekarang() {
    busy(true);
    try { const r = await api('kirimSekarang'); if (r.semua) setData(r.semua); toast(r.catatan || `Terkirim ke ${r.penyewa} penyewa${r.gagal ? ', ' + r.gagal + ' gagal' : ''}${r.pemilik ? ', ringkasan ke pemilik' : ''}`, !!r.catatan); }
    catch (e) { toast(e.message, true); } finally { busy(false); }
  },
  async resetDemo() {
    if (!await konfirmasi('Kembalikan data contoh?', 'Semua perubahan di mode contoh akan dihapus dan diganti data contoh 6 kos.', 'Kembalikan', true)) return;
    store.del(DEMO_KEY); demoStore = null; S.bulan = S.kasBulan = null; await muat(); toast('Data contoh dikembalikan');
  },
  keluarApp() { store.del('kosPin'); S.pin = ''; S.data = null; tampilLogin(); }
};

/* ---------- form submit ---------- */
const FORM = {
  async kos(v) { const r = await aksi('saveKos', { id: v.id, nama: v.nama, alamat: v.alamat, catatan: v.catatan, jumlahKamar: v.jumlahKamar, awalan: v.awalan, hargaDefault: angka(v.hargaDefault) }, v.id ? 'Kos disimpan' : 'Kos ditambahkan'); closeSheet(); if (!v.id) location.hash = '#/kos/' + r.id; },
  async kamar(v) { const r = await aksi('saveKamar', { id: v.id, kosId: v.kosId, nomor: v.nomor, harga: angka(v.harga), fasilitas: v.fasilitas }, v.id ? 'Kamar disimpan' : 'Kamar ditambahkan'); openKamar(r.id); },
  async penyewa(v) {
    await aksi('savePenyewa', { id: v.id, kamarId: v.kamarId, nama: v.nama, wa: v.wa, tglMasuk: v.tglMasuk, hariTempo: v.hariTempo, harga: angka(v.harga), deposit: angka(v.deposit), catatan: v.catatan }, v.id ? 'Data penyewa disimpan' : 'Penyewa ditambahkan');
    openKamar(v.kamarId);
  },
  async keluar(v) { const p = penyewaById(v.id); const r = await aksi('keluarPenyewa', v, 'Penyewa sudah keluar'); openKamar(p.kamarId); },
  async bayar(v) {
    const b = await aksi('bayar', { tagihanId: v.tagihanId, nominal: angka(v.nominal), tanggal: v.tanggal, metode: v.metode, catatan: v.catatan }, 'Pembayaran tersimpan');
    openKuitansi(b.id);
  },
  async kirim(v) {
    const btn = sheetEl && sheetEl.querySelector('[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Mengirim...'; }
    busy(true);
    try {
      const r = await api('kirimWa', v.jenis === 'kuitansi' ? { bayarId: v.id, pesan: v.pesan } : { tagihanId: v.id, pesan: v.pesan });
      setData(r.semua); closeSheet(); toast('Pesan terkirim ke ' + r.nama);
    } catch (e) {
      toast(e.message, true);
      if (btn) { btn.disabled = false; btn.innerHTML = IC.send + 'Kirim sekarang'; }
    } finally { busy(false); }
  },
  async linkPendek(v) {
    const btn = sheetEl && sheetEl.querySelector('[type=submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Membuat...'; }
    busy(true);
    try {
      const r = await api('buatLinkPendek', { kosId: v.kosId, alias: v.alias, url: urlKos(v.kosId) });
      setData(r.semua); closeSheet();
      try { await navigator.clipboard.writeText(r.hasil.linkPendek); toast('Link dibuat dan disalin: ' + r.hasil.linkPendek); }
      catch (e) { toast('Link dibuat: ' + r.hasil.linkPendek); }
    } catch (e) {
      toast(e.message, true);
      if (btn) { btn.disabled = false; btn.textContent = 'Buat link'; }
    } finally { busy(false); }
  },
  async foto(v) { await aksi('ubahFoto', v, 'Keterangan disimpan'); closeSheet(); },
  async profil(v) {
    await aksi('saveProfil', v, 'Profil disimpan'); closeSheet();
  },
  async tagihan(v) { await aksi('ubahTagihan', { id: v.id, nominal: angka(v.nominal), jatuhTempo: v.jatuhTempo, catatan: v.catatan }, 'Tagihan diubah'); openTagihan(v.id); },
  async pengeluaran(v) { await aksi('savePengeluaran', { id: v.id, kosId: v.kosId, kategori: v.kategori, nominal: angka(v.nominal), tanggal: v.tanggal, keterangan: v.keterangan }, 'Pengeluaran tersimpan'); S.kasBulan = C.periodeOf(v.tanggal); closeSheet(); if (route().page !== 'kas') location.hash = '#/kas'; else render(); },
  async settings(v, f) {
    v.kirimPenyewa = f.kirimPenyewa.checked ? 'ya' : 'tidak';
    v.kirimPemilik = f.kirimPemilik.checked ? 'ya' : 'tidak';
    await aksi('saveSettings', v, 'Pengaturan disimpan');
    if (v.pinBaru) { S.pin = v.pinBaru; store.set('kosPin', v.pinBaru); }
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.closest('[disabled]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el)).catch(() => { });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetEl) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit', e => {
  const f = e.target, h = FORM[f.dataset.form];
  if (!h) return;
  e.preventDefault();
  Promise.resolve(h(Object.fromEntries(new FormData(f)), f)).catch(() => { });
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && el.dataset.change === 'fKos') { S.fKos = el.value; render(); }
  const up = e.target.closest('[data-upload]');
  if (up && up.files && up.files.length) { const files = [...up.files]; up.value = ''; uploadFotos(up.dataset.upload, files); }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('money')) {
    const el = e.target, before = el.value.length, pos = el.selectionStart;
    el.value = fmtAngka(angka(el.value));
    const p = Math.max(0, pos + el.value.length - before); el.setSelectionRange(p, p);
  }
});
window.addEventListener('hashchange', () => { closeSheet(true); render(); });

/* ---------- login ---------- */
function tampilLogin(err) {
  $('#root').innerHTML = `<div class="login"><form class="panel" id="loginForm">
    <img class="brand-mark" src="icon-192.png" alt="" style="width:56px;height:56px;border-radius:14px">
    <h1>Pembukuan Kos</h1><p class="muted" style="margin:0 0 20px">Masukkan PIN untuk membuka aplikasi.</p>
    <div class="field"><label for="pin" class="sr">PIN</label><input class="input pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required autofocus></div>
    <p class="small" id="loginErr" style="color:var(--telat);min-height:20px;margin:-6px 0 10px">${err ? esc(err) : ''}</p>
    <button class="btn block" type="submit">Masuk</button>
  </form></div>`;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation();
    S.pin = $('#pin').value.trim();
    busy(true);
    try { await api('login'); store.set('kosPin', S.pin); $('#root').innerHTML = ''; await muat(); }
    catch (er) { $('#loginErr').textContent = er.message; S.pin = ''; }
    finally { busy(false); }
  });
}

if (DEMO || S.pin) muat(); else tampilLogin();
</script>
